[project]
name = "flight-deal-monitor"
version = "0.1.0"
description = "Telegram-controlled background flight deal monitor"
requires-python = ">=3.12"
dependencies = [
  "fast-flights>=3.1,<4",
  "python-telegram-bot>=21.6,<23",
  "httpx>=0.27",
  "playwright>=1.47",
  "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
flight-monitor = "flight_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
